<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sovel · 缺省图像</title><style>
*{box-sizing:border-box}body{margin:0;background:#17191c;color:#f2f0eb;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:880px;margin:auto;padding:28px 24px}header{margin-bottom:22px}small,.eyebrow{color:#d5b782;letter-spacing:3px;font-size:11px}h1{font-size:28px;font-weight:550;letter-spacing:-1px;margin:8px 0}p{color:#929398;margin:6px 0}h2{font-size:18px;font-weight:500;margin:22px 0 14px}section{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}figure{margin:0}figure>img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;box-shadow:0 12px 28px #0003}figcaption{margin-top:12px}figcaption span{display:block;color:#929398;font-size:12px}.artists{grid-template-columns:repeat(2,minmax(0,132px));gap:32px}.artists figure>img{border-radius:50%}.samples{display:flex;align-items:center;gap:12px;margin-top:12px}.samples img{width:38px;height:38px;border-radius:50%}footer{border-top:1px solid #ffffff12;margin-top:24px;padding-top:20px;color:#929398;font-size:12px}a{color:#d5b782}@media(max-width:650px){main{padding:28px 22px}section{grid-template-columns:repeat(2,1fr);gap:20px 16px}h1{font-size:28px}}
</style><main><header><div class="eyebrow">Sovel / ARTWORK COLLECTION 01</div><h1>即使没有封面，也有自己的样子。</h1><p>本地缺省图像 · 固定随机分配 · 离线可用</p></header><h2>专辑 / 细微的光与质感</h2><section id="albums"></section><h2>艺术家 / 中性雕塑头像</h2><section class="artists" id="artists"></section><footer>真实封面和头像优先。缺失或加载失败时回退，同一专辑 / 歌手始终保持一致。<br>本组由内置 imagegen 生成，不对应真实艺术家。<a href="../../?view=focus&page=library&v=22">返回播放器 DEMO ↗</a></footer></main><script>
const groups={albums:[['album-amber','流金','香槟金 · 声波丝带'],['album-tidal','夜潮','深海青 · 水面折光'],['album-dusk','暮色','烟紫蓝 · 透光玻璃'],['album-dune','沙丘','暖铜色 · 细密砂纹']],artists:[['artist-bronze','暖金','陶瓷质感'],['artist-slate','冷银','磨砂玻璃']]};for(const [id,items] of Object.entries(groups)){document.getElementById(id).innerHTML=items.map(([file,name,note])=>`<figure><img src="../../mobile/assets/placeholders/${file}.jpg" alt="${name}"><figcaption>${name}<span>${note}</span></figcaption>${id==='artists'?`<div class="samples"><img src="../../mobile/assets/placeholders/${file}.jpg" alt="小尺寸预览"><span style="color:#929398;font-size:12px">列表中的 38px 预览</span></div>`:''}</figure>`).join('')}
</script></html>
