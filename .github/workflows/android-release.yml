name: Android release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    outputs:
      preview: ${{ steps.version.outputs.preview }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Derive version from tag
        id: version
        run: node scripts/release.mjs prepare
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - name: Install Android SDK components
        run: |
          sdkmanager "cmdline-tools;latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          for (const key of ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']) {
            if (!process.env[key]) throw new Error(`Missing release signing secret: ${key}`);
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/sovel-release.keystore`, Buffer.from(process.env.KEYSTORE_BASE64, 'base64'), {mode: 0o600});
          NODE
      - name: Build signed universal APK
        env:
          NODE_ENV: production
          SOVEL_KEYSTORE_PATH: ${{ runner.temp }}/sovel-release.keystore
          SOVEL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SOVEL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOVEL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g'
      - name: Verify APK signature and prepare update manifest
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          node scripts/release.mjs package
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: mobile/release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sovel-release.keystore"
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PREVIEW: ${{ needs.build.outputs.preview }}
        shell: bash
        run: |
          set -euo pipefail
          # Published tags/releases are immutable: a new build gets a new tag.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Publish a new version instead of replacing installed update assets."
            exit 1
          fi
          args=(--draft --verify-tag --title "Sovel HiFi ${RELEASE_TAG#v}" --generate-notes)
          if [ "$PREVIEW" = true ]; then args+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" release/* "${args[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
